<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>応用情報 演習</title>
<style>
  :root{
    --paper:#EDF1F5; --ink:#152238; --ink-soft:#4C5A70; --line:#D2DAE3;
    --card:#FFFFFF; --amber:#C98A2C; --teal:#2F6F6D; --error:#B5533C;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:18px 20px 0;background:var(--ink);color:var(--paper);}
  .brand{font-size:13px;letter-spacing:.02em;color:#9FB0C6;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .backlink{color:#9FB0C6;font-size:12px;text-decoration:underline;cursor:pointer;}
  .statrow{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .num{font-family:var(--mono);font-size:22px;font-weight:600;}
  .stat .label{font-size:11px;color:#9FB0C6;}
  .streak-flame{color:var(--amber);}
  main{flex:1;padding:20px;}
  .progressbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px;}
  .progressbar .fill{height:100%;background:var(--teal);transition:width .3s ease;}
  .qmeta{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .qmeta .tag{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:2px 8px;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px;}
  .qtext{font-size:16px;line-height:1.7;margin:0;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:15px;line-height:1.6;text-align:left;cursor:pointer;transition:border-color .15s ease, background .15s ease;width:100%;}
  .choice:active{background:#F7F9FB;}
  .choice .mark{font-family:var(--mono);font-weight:600;color:var(--ink-soft);flex-shrink:0;width:18px;}
  .choice.correct{border-color:var(--teal);background:#EAF3F2;}
  .choice.correct .mark{color:var(--teal);}
  .choice.wrong{border-color:var(--error);background:#F8ECE8;}
  .choice.wrong .mark{color:var(--error);}
  .choice.disabled{cursor:default;}
  .explain{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);font-size:14px;line-height:1.7;color:var(--ink-soft);}
  .explain .head{font-family:var(--mono);font-size:12px;color:var(--ink);margin-bottom:6px;font-weight:600;}
  .nextbtn{width:100%;padding:14px;margin-top:16px;background:var(--ink);color:var(--paper);border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;}
  .nextbtn:active{opacity:.85;}
  .footer-note{text-align:center;font-size:11px;color:var(--ink-soft);padding:10px 20px 24px;}
  .resetbtn{margin-top:18px;padding:10px 18px;background:none;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .ai-ask-btn{width:100%;padding:12px;margin-top:10px;background:var(--card);color:var(--teal);border:1px solid var(--teal);border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .ai-ask-btn:active{background:#EAF3F2;}
  .ai-ask-btn svg{width:16px;height:16px;flex-shrink:0;}
  .ai-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:90%;text-align:center;z-index:50;}
  .ai-toast.show{opacity:1;}

  /* PM (descriptive) mode */
  .passage{font-size:14px;line-height:1.9;white-space:pre-wrap;color:var(--ink);max-height:260px;overflow-y:auto;padding-right:4px;}
  .passage-label{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
  .subq{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;}
  .subq:first-of-type{border-top:none;margin-top:0;padding-top:0;}
  .subq-prompt{font-size:14px;line-height:1.7;margin-bottom:8px;}
  .subq-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--sans);resize:vertical;min-height:44px;}
  .subq-answer{margin-top:8px;background:#EAF3F2;border:1px solid var(--teal);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink);}
  .subq-answer .label{font-family:var(--mono);font-size:11px;color:var(--teal);font-weight:600;margin-bottom:4px;}
  .revealbtn{width:100%;padding:12px;margin-top:16px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;}
  .selfgrade{display:flex;gap:10px;margin-top:14px;}
  .selfgrade button{flex:1;padding:12px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);}
  .selfgrade button.ok{border-color:var(--teal);color:var(--teal);}
  .selfgrade button.ng{border-color:var(--error);color:var(--error);}
  .pm-title{font-size:15px;font-weight:600;margin:0 0 10px;}

  /* Home / list screen */
  .session-block{margin-bottom:22px;}
  .session-title{font-size:15px;font-weight:700;margin:0 0 4px;}
  .session-sub{font-size:11px;color:var(--ink-soft);margin-bottom:12px;}
  .section-label{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-weight:600;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .qgrid{display:grid;grid-template-columns:repeat(5, 1fr);gap:6px;}
  .qcell{
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:8px 4px;text-align:center;cursor:pointer;position:relative;
  }
  .qcell.empty{opacity:.35;cursor:default;}
  .qcell .n{font-family:var(--mono);font-size:12px;font-weight:600;}
  .qcell .dots{display:flex;gap:2px;justify-content:center;margin-top:4px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .dot.ok{background:var(--teal);}
  .dot.ng{background:var(--error);}
  .pmarea-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;cursor:pointer;
  }
  .pmarea-row.empty{opacity:.4;cursor:default;}
  .pmarea-left{display:flex;align-items:center;gap:10px;}
  .pmarea-num{font-family:var(--mono);font-size:12px;color:var(--ink-soft);width:20px;}
  .pmarea-name{font-size:14px;}
  .randombtn{width:100%;padding:12px;margin-top:6px;background:var(--card);color:var(--ink-soft);border:1px dashed var(--line);border-radius:6px;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ====== 設定 ======
const SITE_BASE_URL = "https://mountakagi.github.io/ap-quiz-app";
const AM_TOTAL = 80; // 応用情報の午前は毎回80問
const PM_AREAS = [
  "情報セキュリティ", "経営戦略", "プログラミング", "システムアーキテクチャ",
  "ネットワーク", "データベース", "組込みシステム開発", "情報システム開発",
  "プロジェクトマネジメント", "サービスマネジメント", "システム監査"
];
const SESSION_LABELS = {
  "2025r07a": "2025年 秋期（令和7年度秋期）",
  "2025r07s": "2025年 春期（令和7年度春期）"
};
// ====================

let QUESTIONS = [];    // 午前（多肢選択式）
let PM_QUESTIONS = []; // 午後（記述式）
const STORAGE_KEY = "ap-quiz-progress-v2";

let state = {
  screen: "home", // home | am | pm
  currentAmId: null,
  currentPmId: null,
  selected: null,
  pmRevealed: false,
  order: [], idx: 0, // ランダム演習用
  history: {},          // カテゴリ別集計
  qHistory: {},          // 問題ID別の直近結果（配列、最新が末尾）
  streakDays: 0, lastPlayedDate: null, totalAnswered: 0
};

function shuffledOrder(arr){
  const a = arr.map((_, i) => i);
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state.history = saved.history || {};
      state.qHistory = saved.qHistory || {};
      state.streakDays = saved.streakDays || 0;
      state.lastPlayedDate = saved.lastPlayedDate || null;
      state.totalAnswered = saved.totalAnswered || 0;
    }
  }catch(e){ console.error("load failed", e); }
}

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      history: state.history, qHistory: state.qHistory,
      streakDays: state.streakDays,
      lastPlayedDate: state.lastPlayedDate, totalAnswered: state.totalAnswered
    }));
  }catch(e){ console.error("save failed", e); }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function bumpStreak(){
  const today = todayStr();
  if(state.lastPlayedDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  state.streakDays = (state.lastPlayedDate === yesterday) ? state.streakDays + 1 : 1;
  state.lastPlayedDate = today;
}

function recordAnswer(qid, cat, correct){
  if(!state.history[cat]) state.history[cat] = {correct:0, total:0};
  state.history[cat].total += 1;
  if(correct) state.history[cat].correct += 1;
  if(!state.qHistory[qid]) state.qHistory[qid] = [];
  state.qHistory[qid].push(correct ? "ok" : "ng");
  if(state.qHistory[qid].length > 3) state.qHistory[qid].shift();
  state.totalAnswered += 1;
  bumpStreak();
  saveProgress();
}

function headerHtml(showBack){
  return `
    <header>
      <p class="brand">
        <span>応用情報技術者試験・演習</span>
        ${showBack ? `<span class="backlink" id="backHome">← 一覧に戻る</span>` : ""}
      </p>
      <div class="statrow">
        <div class="stat"><span class="num streak-flame">${state.streakDays}日</span><span class="label">連続学習</span></div>
        <div class="stat"><span class="num">${state.totalAnswered}</span><span class="label">総回答数</span></div>
      </div>
    </header>
  `;
}

function bindBack(){
  const b = document.getElementById("backHome");
  if(b) b.onclick = () => { state.screen = "home"; state.selected = null; state.pmRevealed = false; render(); };
}

function render(){
  if(state.screen === "am") { renderAmQuestion(); return; }
  if(state.screen === "pm") { renderPmQuestion(); return; }
  renderHome();
}

// ---------- ホーム画面 ----------

function dotsHtml(qid){
  const arr = state.qHistory[qid] || [];
  let html = '<div class="dots">';
  for(let i=0;i<3;i++){
    const r = arr[i];
    html += `<span class="dot ${r==='ok'?'ok':r==='ng'?'ng':''}"></span>`;
  }
  html += '</div>';
  return html;
}

function renderHome(){
  const app = document.getElementById("app");
  const sessions = Array.from(new Set([
    ...QUESTIONS.map(q => q.session),
    ...PM_QUESTIONS.map(q => q.session)
  ])).filter(Boolean);

  let sessionsHtml = "";
  sessions.forEach(sessionId => {
    const label = SESSION_LABELS[sessionId] || sessionId;
    const amMap = {};
    QUESTIONS.filter(q => q.session === sessionId).forEach(q => amMap[q.number] = q);
    const pmMap = {};
    PM_QUESTIONS.filter(q => q.session === sessionId).forEach(q => pmMap[q.areaNumber] = q);

    let amCells = "";
    for(let n = 1; n <= AM_TOTAL; n++){
      const q = amMap[n];
      if(q){
        amCells += `<div class="qcell" data-am="${q.id}"><div class="n">${n}</div>${dotsHtml(q.id)}</div>`;
      }else{
        amCells += `<div class="qcell empty"><div class="n">${n}</div></div>`;
      }
    }

    let pmRows = "";
    PM_AREAS.forEach((name, i) => {
      const areaNum = i + 1;
      const q = pmMap[areaNum];
      if(q){
        pmRows += `
          <div class="pmarea-row" data-pm="${q.id}">
            <div class="pmarea-left"><span class="pmarea-num">問${areaNum}</span><span class="pmarea-name">${name}</span></div>
            ${dotsHtml(q.id)}
          </div>`;
      }else{
        pmRows += `
          <div class="pmarea-row empty">
            <div class="pmarea-left"><span class="pmarea-num">問${areaNum}</span><span class="pmarea-name">${name}</span></div>
            <span style="font-size:11px;color:var(--ink-soft);">未収録</span>
          </div>`;
      }
    });

    sessionsHtml += `
      <div class="session-block">
        <p class="session-title">${label}</p>
        <p class="session-sub">午後は必須の問1（情報セキュリティ）＋選択10問中4問を解答する形式です</p>
        <div class="section-label"><span>午前（1〜${AM_TOTAL}）</span></div>
        <div class="qgrid" data-session="${sessionId}">${amCells}</div>
        <button class="randombtn" data-random="${sessionId}">この回をランダム演習する</button>
        <div class="section-label" style="margin-top:18px;"><span>午後（分野別・11問）</span></div>
        <div>${pmRows}</div>
      </div>
    `;
  });

  if(!sessionsHtml){
    sessionsHtml = `<div class="qcard">まだ問題データがありません。</div>`;
  }

  app.innerHTML = headerHtml(false) + `<main>${sessionsHtml}</main><p class="footer-note">個人学習用・記録は端末に保存されます</p>`;

  app.querySelectorAll("[data-am]").forEach(el => {
    el.onclick = () => { state.currentAmId = el.getAttribute("data-am"); state.selected = null; state.screen = "am"; render(); };
  });
  app.querySelectorAll("[data-pm]").forEach(el => {
    el.onclick = () => { state.currentPmId = el.getAttribute("data-pm"); state.pmRevealed = false; state.screen = "pm"; render(); };
  });
  app.querySelectorAll("[data-random]").forEach(el => {
    el.onclick = () => {
      const sid = el.getAttribute("data-random");
      const pool = QUESTIONS.filter(q => q.session === sid);
      if(pool.length === 0) return;
      state.order = shuffledOrder(pool).map(i => pool[i].id);
      state.currentAmId = state.order[0];
      state._randomQueue = state.order.slice(1);
      state.selected = null;
      state.screen = "am";
      render();
    };
  });
}

// ---------- 午前（多肢選択式） ----------

function renderAmQuestion(){
  const app = document.getElementById("app");
  const q = QUESTIONS.find(x => x.id === state.currentAmId);
  if(!q){ state.screen = "home"; renderHome(); return; }

  app.innerHTML = headerHtml(true) + `
    <main>
      <div class="qmeta"><span class="tag">${q.category}</span><span>問${q.number}</span></div>
      <div class="qcard"><p class="qtext">${q.text}</p></div>
      <div class="choices" id="choices"></div>
      <div id="explainWrap"></div>
    </main>
    <p class="footer-note">個人学習用・記録は端末に保存されます</p>
  `;
  bindBack();

  const choicesEl = document.getElementById("choices");
  q.choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="mark">${"アイウエ"[i]}</span><span>${c}</span>`;
    btn.onclick = () => selectChoice(i, q);
    choicesEl.appendChild(btn);
  });

  if(state.selected !== null) showResult(q);
}

function selectChoice(i, q){
  if(state.selected !== null) return;
  state.selected = i;
  recordAnswer(q.id, q.category, i === q.answer);
  showResult(q);
}

function showResult(q){
  document.querySelectorAll(".choice").forEach((b, i) => {
    b.classList.add("disabled");
    if(i === q.answer) b.classList.add("correct");
    else if(i === state.selected) b.classList.add("wrong");
  });
  const hasNext = state._randomQueue && state._randomQueue.length > 0;
  const wrap = document.getElementById("explainWrap");
  wrap.innerHTML = `
    <div class="qcard explain" style="margin-top:14px;">
      <div class="head">解説</div>
      <div>${q.explain}</div>
    </div>
    <button class="ai-ask-btn" id="aiAskBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L14 9 L21 12 L14 15 L12 22 L10 15 L3 12 L10 9 Z"/></svg>
      この問題をAIに質問する
    </button>
    <button class="nextbtn" id="nextBtn">${hasNext ? "次の問題へ" : "一覧に戻る"}</button>
  `;
  document.getElementById("nextBtn").onclick = () => {
    if(hasNext){
      state.currentAmId = state._randomQueue.shift();
      state.selected = null;
      renderAmQuestion();
    }else{
      state.screen = "home"; state.selected = null; render();
    }
  };
  document.getElementById("aiAskBtn").onclick = () => askAI(buildAIPromptAM(q));
}

function buildAIPromptAM(q){
  const url = `${SITE_BASE_URL}/question/${q.id}.html`;
  return [
    "次のIT資格試験の問題ページを開き、掲載されている問題・正答・解説を読み込んだうえで、解説をさらに深掘りしてください。",
    "",
    `参照URL: ${url}`,
    "",
    "次の順番で、初学者にも分かるように説明してください。",
    "",
    "1. 正解に至る判断手順",
    "",
    "2. ほかの選択肢が誤りである理由",
    "",
    "3. 関連する重要知識",
    "",
    "4. 類題での見分け方"
  ].join("\n");
}

// ---------- 午後（記述式） ----------

function renderPmQuestion(){
  const app = document.getElementById("app");
  const q = PM_QUESTIONS.find(x => x.id === state.currentPmId);
  if(!q){ state.screen = "home"; renderHome(); return; }

  app.innerHTML = headerHtml(true) + `
    <main>
      <div class="qmeta"><span class="tag">${q.category}</span><span>午後 問${q.areaNumber}</span></div>
      <div class="qcard">
        <p class="pm-title">${q.title}</p>
        <div class="passage-label">事例文</div>
        <div class="passage">${q.passage}</div>
      </div>
      <div class="qcard" id="subqWrap"></div>
      <button class="revealbtn" id="revealBtn">${state.pmRevealed ? "解答例を隠す" : "解答例を見る"}</button>
      <div id="selfgradeWrap"></div>
      <div id="pmAiWrap"></div>
    </main>
    <p class="footer-note">個人学習用・記録は端末に保存されます</p>
  `;
  bindBack();

  const subqWrap = document.getElementById("subqWrap");
  q.subQuestions.forEach((sq) => {
    const block = document.createElement("div");
    block.className = "subq";
    block.innerHTML = `
      <div class="subq-prompt"><strong>${sq.id}</strong> ${sq.prompt}</div>
      <textarea class="subq-input" placeholder="ここに自分の解答を書いてみる（省略可）"></textarea>
      ${state.pmRevealed ? `<div class="subq-answer"><div class="label">解答例</div><div>${sq.modelAnswer}</div></div>` : ""}
    `;
    subqWrap.appendChild(block);
  });

  document.getElementById("revealBtn").onclick = () => { state.pmRevealed = !state.pmRevealed; renderPmQuestion(); };

  const gradeWrap = document.getElementById("selfgradeWrap");
  if(state.pmRevealed){
    gradeWrap.innerHTML = `
      <div class="selfgrade">
        <button class="ok" id="pmOkBtn">できた</button>
        <button class="ng" id="pmNgBtn">できなかった</button>
      </div>
    `;
    document.getElementById("pmOkBtn").onclick = () => selfGradePM(q, true);
    document.getElementById("pmNgBtn").onclick = () => selfGradePM(q, false);

    const aiWrap = document.getElementById("pmAiWrap");
    aiWrap.innerHTML = `
      <button class="ai-ask-btn" id="pmAiAskBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L14 9 L21 12 L14 15 L12 22 L10 15 L3 12 L10 9 Z"/></svg>
        この問題をAIに質問する
      </button>
    `;
    document.getElementById("pmAiAskBtn").onclick = () => askAI(buildAIPromptPM(q));
  }
}

function selfGradePM(q, correct){
  recordAnswer(q.id, q.category, correct);
  state.screen = "home";
  state.pmRevealed = false;
  render();
}

function buildAIPromptPM(q){
  const url = `${SITE_BASE_URL}/pm/${q.id}.html`;
  return [
    "次のIT資格試験（午後・記述式）の問題ページを開き、掲載されている事例文・設問・解答例を読み込んだうえで、解説してください。",
    "",
    `参照URL: ${url}`,
    "",
    "次の順番で、初学者にも分かるように説明してください。",
    "",
    "1. 各設問の解答例に至る考え方",
    "",
    "2. 部分点になりやすいポイントや、よくある誤答パターン",
    "",
    "3. 関連する重要知識",
    "",
    "4. 類題での考え方のコツ"
  ].join("\n");
}

// ---------- 共通 ----------

function showToast(msg){
  let el = document.getElementById("aiToast");
  if(!el){ el = document.createElement("div"); el.id = "aiToast"; el.className = "ai-toast"; document.getElementById("app").appendChild(el); }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
}

async function askAI(prompt){
  let copied = false;
  try{ await navigator.clipboard.writeText(prompt); copied = true; }catch(e){ copied = false; }
  window.open("https://claude.ai/new", "_blank");
  showToast(copied ? "質問文をコピーしました。入力欄に貼り付けてください" : "自動コピーに失敗しました。手動でコピーしてください");
}

(async function init(){
  try{
    const res = await fetch("./questions.json");
    QUESTIONS = await res.json();
  }catch(e){ console.error("AM load failed", e); }
  try{
    const resPm = await fetch("./questions-pm.json");
    PM_QUESTIONS = await resPm.json();
  }catch(e){ console.error("PM load failed", e); }

  loadProgress();
  render();
})();
</script>
