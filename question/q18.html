<body>
  <h1>応用情報技術者試験 - ソフトウェア（OS）（q18）</h1>
  <div class="question">二つのタスクが共用する二つの資源を排他的に使用するとき、デッドロックが発生するおそれがある。このデッドロックの発生を防ぐ方法はどれか。</div>
  <ul>
      <li>ア: 一方のタスクの優先度を高くする。</li>
      <li class="correct">イ: 資源獲得の順序を両方のタスクで同じにする。</li>
      <li>ウ: 資源獲得の順序を両方のタスクで逆にする。</li>
      <li>エ: 両方のタスクの優先度を同じにする。</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>イ: 資源獲得の順序を両方のタスクで同じにする。</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>資源獲得の順序を全タスクで統一することで循環待ちの状態が起こらなくなり、デッドロックを防止できる。</div>
  </div>
</body>
