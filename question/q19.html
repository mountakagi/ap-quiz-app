<body>
  <h1>応用情報技術者試験 - ハードウェア（キャッシュ）（q19）</h1>
  <div class="question">4ブロックのキャッシュメモリC0～C3が表に示す状態である。ここで、新たに別のブロックの内容をキャッシュメモリにロードする必要が生じたとき、C2のブロックを置換の対象とするアルゴリズムはどれか。（C2は最終参照時刻が最も古い）</div>
  <ul>
      <li>ア: FIFO</li>
      <li>イ: LFU</li>
      <li>ウ: LIFO</li>
      <li class="correct">エ: LRU</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>エ: LRU</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>最終参照時刻が最も古いブロックを置換対象とするのはLRU（Least Recently Used）アルゴリズムの特徴である。</div>
  </div>
