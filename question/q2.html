<body>
  <h1>応用情報技術者試験 - アルゴリズム（待ち行列）（q2）</h1>
  <div class="question">コンピュータによる伝票処理システムがある。このシステムは、伝票データをためる待ち行列をもち、M/M/1の待ち行列モデルが適用できるものとする。平均待ち時間がT秒以上となるのは、システムの利用率が少なくとも何%以上となったときか。</div>
  <ul>
      <li>ア: 33</li>
      <li class="correct">イ: 50</li>
      <li>ウ: 67</li>
      <li>エ: 80</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>イ: 50</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>M/M/1の平均待ち時間は 利用率ρ/(1-ρ)×平均サービス時間 で表される。この式にT秒以上という条件を当てはめると、利用率が50%以上のときに条件を満たす。</div>
  </div>
