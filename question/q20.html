  <h1>応用情報技術者試験 - ハードウェア（電子回路）（q20）</h1>
  <div class="question">図のLED点灯回路において、LEDに10ミリAの電流が流れるように抵抗値を決定したときに、回路全体の消費電力に占めるLEDの消費電力の割合は何%か。ここで、LEDの順方向電圧は2Vとし、電源の消費電力は無視するものとする。（電源電圧10V）</div>
  <ul>
      <li class="correct">ア: 20</li>
      <li>イ: 25</li>
      <li>ウ: 80</li>
      <li>エ: 100</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>ア: 20</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>LEDの消費電力=2V×10mA=20mW、抵抗の消費電力=(10-2)V×10mA=80mW、合計100mWのうちLEDは20%を占める。</div>
  </div>
