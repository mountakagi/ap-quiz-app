<body>
  <h1>応用情報技術者試験 - ネットワーク（q34）</h1>
  <div class="question">複数台のレイヤー2スイッチで構成されるネットワークが複数の経路をもつ場合に、イーサネットフレームのループが発生することがある。そのループの発生を防ぐためのTCP/IPネットワークインタフェース層のプロトコルはどれか。</div>
  <ul>
      <li>ア: IGMP</li>
      <li>イ: RIP</li>
      <li>ウ: SIP</li>
      <li class="correct">エ: スパニングツリープロトコル</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>エ: スパニングツリープロトコル</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>レイヤー2スイッチ間のループ発生を防ぐためのプロトコルはスパニングツリープロトコルである。</div>
  </div>
