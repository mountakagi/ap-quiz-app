  body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.8;color:#152238;}
  h1{font-size:16px;color:#4C5A70;font-weight:600;}

<body>
  <h1>応用情報技術者試験 - ネットワーク（q35）</h1>
  <div class="question">ビット誤り率が0.0001%の回線を使って、1,500バイトのパケットを10,000個送信するとき、誤りが含まれるパケットの個数の期待値はおよそ幾らか。</div>
  <ul>
      <li>ア: 10</li>
      <li>イ: 15</li>
      <li>ウ: 80</li>
      <li class="correct">エ: 120</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>エ: 120</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>1,500バイト=12,000ビット、誤り率0.000001を掛けると1パケットあたり約0.012。10,000個で期待値は0.012×10,000=120。</div>
  </div>
