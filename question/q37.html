<body>
  <h1>応用情報技術者試験 - セキュリティ（q37）</h1>
  <div class="question">デジタル署名が付与されたソフトウェアをインストールするときに、そのソフトウェアの発行元を確認するために使用する証明書はどれか。</div>
  <ul>
      <li>ア: EV SSL証明書</li>
      <li>イ: クライアント証明書</li>
      <li class="correct">ウ: コードサイニング証明書</li>
      <li>エ: サーバ証明書</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>ウ: コードサイニング証明書</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>ソフトウェアの発行元を確認するために使用される証明書はコードサイニング証明書である。</div>
  </div>
