  <h1>応用情報技術者試験 - ソフトウェア（開発技術）（q48）</h1>
  <div class="question">エラー埋込み法を用いて残存エラー数を推定する。当初の埋込みエラーは48個である。テスト期間中に発見されたエラーの内訳は、埋込みエラーが36個、真のエラーが42個である。このとき、残存する真のエラーは何個と推定されるか。</div>
  <ul>
      <li>ア: 6</li>
      <li class="correct">イ: 14</li>
      <li>ウ: 54</li>
      <li>エ: 56</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>イ: 14</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>埋込みエラーの発見率=36/48=0.75。真のエラーの総数は42÷0.75=56個と推定され、残存する真のエラーは56－42＝14個。</div>
  </div>
