  ul{list-style:none;padding:0;}

  .explain{margin-top:20px;padding-top:16px;border-top:1px dashed #D2DAE3;}

<body>
  <h1>応用情報技術者試験 - プロジェクトマネジメント（q52）</h1>
  <div class="question">チームの発展段階を五つに区分したタックマンモデルによれば、メンバーの異なる考え方や価値観が明確になり、メンバーがそれぞれの意見を主張し合う段階はどれか。</div>
  <ul>
      <li>ア: 安定期 (Norming)</li>
      <li>イ: 遂行期 (Performing)</li>
      <li>ウ: 成立期 (Forming)</li>
      <li class="correct">エ: 動乱期 (Storming)</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>エ: 動乱期 (Storming)</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>メンバー間で意見や価値観の違いが顕在化し対立が生じる段階は動乱期（Storming）である。</div>
  </div>
</body>
