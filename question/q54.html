  <h1>応用情報技術者試験 - プロジェクトマネジメント（経営科学）（q54）</h1>
  <div class="question">自動生産システムの増強に関する次のデシジョンツリーにおいて、新規にシステムを開発する場合の期待金額価値（EMV）は何億円か。〔新規システム開発〕投資額50億円、60%の確率で需要が大きい（収益80億円）、40%の確率で需要が小さい（収益40億円）。</div>
  <ul>
      <li class="correct">ア: 14</li>
      <li>イ: 20</li>
      <li>ウ: 26</li>
      <li>エ: 64</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>ア: 14</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>EMV=(0.6×80億円＋0.4×40億円)－50億円＝64億円－50億円＝14億円。</div>
  </div>
