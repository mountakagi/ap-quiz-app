  <h1>応用情報技術者試験 - サービスマネジメント（q55）</h1>
  <div class="question">サービスマネジメントのサービス可用性管理において、インシデント又は将来インシデントとなる可能性のある事象について、その発生経路及び発生原因を分析し、発生確率の算出に使用できる技法はどれか。</div>
  <ul>
      <li class="correct">ア: 故障の木解析 (FTA)</li>
      <li>イ: 故障モード・影響解析 (FMEA)</li>
      <li>ウ: コンポーネント障害インパクト分析 (CFIA)</li>
      <li>エ: 単一障害点分析 (SPOF分析)</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>ア: 故障の木解析 (FTA)</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>インシデントの発生経路や原因を分析し発生確率を算出する技法は故障の木解析（FTA）である。</div>
  </div>
