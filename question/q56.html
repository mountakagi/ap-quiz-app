  <div class="question">サービスマネジメントにおける問題管理の活動はどれか。</div>
  <ul>
      <li class="correct">ア: 根本原因の特定</li>
      <li>イ: サービス要求の優先度付け</li>
      <li>ウ: 変更要求の記録</li>
      <li>エ: リリースの検証</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>ア: 根本原因の特定</div>
