<body>
  <h1>応用情報技術者試験 - 経営戦略（マーケティング）（q67）</h1>
  <div class="question">売手側でのマーケティング要素4Pは、買手側での要素4Cに対応するという考え方がある。4Pの一つであるプロモーションに対応する4Cの構成要素はどれか。</div>
  <ul>
      <li>ア: 顧客価値 (Customer Value)</li>
      <li>イ: 顧客コスト (Cost)</li>
      <li class="correct">ウ: コミュニケーション (Communication)</li>
      <li>エ: 利便性 (Convenience)</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>ウ: コミュニケーション (Communication)</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>4Pのプロモーションに対応する4Cの要素はコミュニケーション（Communication）である。</div>
  </div>
