<body>
  <h1>応用情報技術者試験 - 経営戦略（生産管理）（q75）</h1>
  <div class="question">製品X、Yを1台製造するのに必要な部品数は、表のとおりである。製品1台当たりの利益がX、Yともに1万円のとき、利益は最大何万円になるか。ここで、部品Aは120個、部品Bは60個まで使えるものとする。（部品A: X=3,Y=2／部品B: X=1,Y=2）</div>
  <ul>
      <li>ア: 30</li>
      <li>イ: 40</li>
      <li class="correct">ウ: 45</li>
      <li>エ: 60</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>ウ: 45</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>制約 3X+2Y≤120, X+2Y≤60 のもとで X+Yを最大化すると、X=30,Y=15（合計45台）のとき利益は最大45万円となる。</div>
  </div>
</body>
