<body>
  <h1>応用情報技術者試験 - 経営戦略（財務）（q76）</h1>
  <div class="question">A社の貸借対照表の構成は図のとおりであった。A社の自己資本比率は何%か。（流動資産6,000/固定資産4,000、流動負債4,500/固定負債2,000/資本金2,000/資本剰余金1,000/利益剰余金500、単位百万円）</div>
  <ul>
      <li>ア: 10</li>
      <li>イ: 20</li>
      <li>ウ: 30</li>
      <li class="correct">エ: 35</li>
  </ul>
  <div class="explain">
    <div class="label">正解</div>
    <div>エ: 35</div>
    <div class="label" style="margin-top:14px;">解説</div>
    <div>自己資本＝資本金2,000＋資本剰余金1,000＋利益剰余金500＝3,500百万円。総資産10,000百万円に対する比率は3,500÷10,000＝35%。</div>
  </div>
